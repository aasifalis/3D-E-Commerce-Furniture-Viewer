server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx doesn't know 3D model types by default.
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.usdz$ {
        types { model/vnd.usdz+zip usdz; }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary;
}
