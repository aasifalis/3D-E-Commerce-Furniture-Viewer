<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your basket | Roomi</title>
  <meta name="description" content="Your Roomi basket." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/basket.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav aria-label="Main">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo" aria-label="Roomi home">Roo<span>mi</span></a>
      <div class="nav-links">
        <a href="index.html">Shop</a>
        <a href="insights.html">Insights</a>
        <a href="business-case.html">Business case</a>
        <a href="basket.html" aria-current="page">Basket <span id="basket-count" class="basket-count">0</span></a>
      </div>
    </div>
  </nav>

  <main id="main">
    <h1 class="page-title">Your basket</h1>
    <div id="basket-container">
      <div id="basket-items" aria-live="polite">
        <p class="loading">Loading basket…</p>
      </div>
      <aside id="basket-summary" aria-label="Basket summary">
        <p class="basket-total">Total: <span id="basket-total">£0.00</span></p>
        <p class="note">Not sure it will fit or match? Use <strong>View in 3D / AR</strong> on any item to place it in your room before you buy.</p>
        <a class="button-secondary" href="index.html">Continue shopping</a>
      </aside>
    </div>
  </main>

  <script type="module" src="js/basket.js"></script>
</body>
</html>
